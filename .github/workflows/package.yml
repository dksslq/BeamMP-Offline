name: Package BeamMP mod

# Builds the client mod (BeamMP.zip) that the offline launcher installs.
# The offline edition cannot download the mod from the BeamMP backend,
# so this zip is published as a release artifact instead.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package mod zip
        shell: bash
        run: |
          set -euo pipefail
          STAGING="$(mktemp -d)"
          # IMPORTANT: 'scripts' contains BeamMP/modScript.lua - the Lua bootstrap
          # that load()s every MP extension (MPCoreNetwork, MPGameNetwork, ...).
          # Without it the game loads the UI but ALL lua globals stay nil
          # ("attempt to index global 'MPCoreNetwork' (a nil value)").
          # 'icons' contains the chat/playerlist UI icons.
          cp -r lua ui locales settings vehicles icons scripts "$STAGING"/
          # OFFLINE marker: this file exists ONLY in offline-edition builds.
          # It lets the launcher / lua / UI (and humans) verify that the
          # installed mod is the offline edition, not an upstream copy.
          cat > "$STAGING/lua/ge/extensions/beammp/OFFLINE_BUILD.lua" <<LUA
          -- Auto-generated by BeamMP-Offline CI. DO NOT EDIT.
          -- Presence of this file identifies the OFFLINE edition of BeamMP.
          -- If this file is missing, the mod was replaced by an upstream
          -- (online) build and the offline launcher should re-install it.
          local M = {
            edition = "offline",
            version = "${GITHUB_REF_NAME:-dev}",
            commit = "${GITHUB_SHA:-unknown}",
            builtAt = "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            repository = "https://github.com/dksslq/BeamMP-Offline",
          }
          return M
          LUA
          # LICENSE is included for compliance (AGPL requires passing the license)
          cp LICENSE "$STAGING"/
          cd "$STAGING"
          zip -qr "$GITHUB_WORKSPACE/BeamMP.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum BeamMP.zip > BeamMP.zip.sha256
          echo "### BeamMP.zip contents:" > contents.txt
          unzip -l BeamMP.zip >> contents.txt

      - name: Verify critical files are in the zip
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            scripts/BeamMP/modScript.lua \
            lua/ge/extensions/MPCoreNetwork.lua \
            lua/ge/extensions/MPGameNetwork.lua \
            lua/ge/extensions/beammp/multiplayer.lua \
            lua/ge/extensions/beammp/OFFLINE_BUILD.lua \
            icons/send.png \
            ui/ui-vue/mods/BeamMP/index.js ;
          do
            if ! unzip -l BeamMP.zip | grep -q " $f$"; then
              echo "FATAL: $f is missing from BeamMP.zip!"
              exit 1
            fi
          done
          echo "All critical files present in BeamMP.zip."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeamMP-mod
          path: |
            BeamMP.zip
            BeamMP.zip.sha256

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BeamMP.zip
            BeamMP.zip.sha256
          fail_on_unmatched_files: true
