name: Package BeamMP mod

# Builds the client mod (BeamMP.zip) that the offline launcher installs.
# The offline edition cannot download the mod from the BeamMP backend,
# so this zip is published as a release artifact instead.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package mod zip
        shell: bash
        run: |
          set -euo pipefail
          STAGING="$(mktemp -d)"
          cp -r lua ui locales settings vehicles "$STAGING"/
          # LICENSE is included for compliance (AGPL requires passing the license)
          cp LICENSE "$STAGING"/
          cd "$STAGING"
          zip -qr "$GITHUB_WORKSPACE/BeamMP.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum BeamMP.zip > BeamMP.zip.sha256
          echo "### BeamMP.zip contents:" > contents.txt
          unzip -l BeamMP.zip >> contents.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeamMP-mod
          path: |
            BeamMP.zip
            BeamMP.zip.sha256

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BeamMP.zip
            BeamMP.zip.sha256
          fail_on_unmatched_files: true
